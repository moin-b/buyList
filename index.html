<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6F6C">
<title>خرید خونه‌مون</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html, body { margin: 0; height: 100%; background: #FFF6F3; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #EEF2EF; }
  #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #FFF6F3; color: #6E2B37;
            font-family: Tahoma, sans-serif; transition: opacity .3s; z-index: 2; }
  #splash img { width: 112px; height: 112px; }
  #splash a { display: none; margin-top: 18px; color: #6E2B37; font-size: 15px; }
  #splash.slow a { display: block; }
  #splash.gone { opacity: 0; pointer-events: none; }
  .box { text-align: center; }
</style>
</head>
<body>
<div id="splash"><div class="box">
  <img src="icon-192.png" alt="">
  <a id="direct" href="#">باز نشد؟ اینجا بزن</a>
</div></div>
<iframe id="app" title="خرید خونه‌مون" allow="clipboard-write"></iframe>
<script>
  // ⬇️ Paste your Apps Script Web app URL here (ends with /exec)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwJcUrY33DoYUXL9i8_Oxc-6bIzEuo-Z6jQbM7aN-ZAlk1Jl1O0xQeSxbrJRGX8Ohsq/exec';

  const frame = document.getElementById('app'), splash = document.getElementById('splash');
  document.getElementById('direct').href = SCRIPT_URL;
  frame.addEventListener('load', () => splash.classList.add('gone'));
  setTimeout(() => splash.classList.add('slow'), 10000);
  frame.src = SCRIPT_URL;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
