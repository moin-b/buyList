<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="tc" content="#6E2B37">
<script>
  // apply last theme before first paint, so the status bar is right from the start
  try {
    var t = JSON.parse(localStorage.getItem('buylist-bar') || 'null');
    if (t && /^#[0-9a-f]{3,8}$/i.test(t.bar)) {
      document.getElementById('tc').setAttribute('content', t.bar);
      document.documentElement.style.background = t.bg;
      document.documentElement.style.colorScheme = t.dark ? 'dark' : 'light';
    }
  } catch (e) {}
</script>
<title>خرید خونه‌مون</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html, body { margin: 0; height: 100%; background: #FFF6F3; overflow: hidden; font-family: Tahoma, sans-serif; color: #3A1F25; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #FFF6F3; }
  .screen { position: fixed; inset: 0; display: grid; place-items: center; background: #FFF6F3; z-index: 2; transition: opacity .3s; padding: 24px; box-sizing: border-box; }
  .screen.gone { opacity: 0; pointer-events: none; }
  .box { text-align: center; width: 100%; max-width: 300px; }
  .box img { width: 112px; height: 112px; }
  .box h1 { font-size: 20px; margin: 12px 0 4px; }
  .box p { margin: 0 0 16px; font-size: 14px; color: #86666C; }
  .box input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 18px; text-align: center; border: 1px solid #F0DCD7; border-radius: 12px; background: #fff; color: #3A1F25; }
  .box button { width: 100%; margin-top: 10px; padding: 12px; font-size: 16px; font-weight: bold; border: 0; border-radius: 12px; background: #C8463F; color: #fff; }
  .err { color: #A3182B !important; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="screen" id="login" hidden>
  <div class="box">
    <img src="icon-192.png" alt="">
    <h1>خرید خونه‌مون</h1>
    <p id="msg">رمز را وارد کن (فقط یک بار)</p>
    <input id="code" type="password" autocomplete="current-password">
    <button id="go">ورود</button>
  </div>
</div>
<div class="screen" id="splash" hidden><div class="box"><img src="icon-192.png" alt=""></div></div>
<iframe id="app" title="خرید خونه‌مون"></iframe>
<script>
  // ⬇️ Paste your Apps Script Web app URL here (ends with /exec)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwt3IAaFwDFHpJ0trEgdCjUKm4f66ovk5zPS-Ao83-rqTbal9HxGLgCKufXMQKHyjDO/exec';

  const $ = id => document.getElementById(id);
  const STORE = 'buylist-code';
  const getCode = () => { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } };
  const setCode = v => { try { v ? localStorage.setItem(STORE, v) : localStorage.removeItem(STORE); } catch (e) {} };

  function askCode(error) {
    $('app').removeAttribute('src');
    $('splash').hidden = true;
    $('login').hidden = false; $('login').classList.remove('gone');
    $('msg').textContent = error ? 'رمز اشتباه بود؛ دوباره وارد کن' : 'رمز را وارد کن (فقط یک بار)';
    $('msg').classList.toggle('err', !!error);
    $('code').value = ''; setTimeout(() => $('code').focus(), 100);
  }
  function open() {
    const code = getCode();
    if (!code) return askCode(false);
    $('login').hidden = true;
    $('splash').hidden = false; $('splash').classList.remove('gone');
    $('app').src = SCRIPT_URL + '?k=' + encodeURIComponent(code);
  }
  $('app').addEventListener('load', () => { if ($('app').getAttribute('src')) $('splash').classList.add('gone'); });
  $('go').addEventListener('click', () => { const v = $('code').value.trim(); if (v) { setCode(v); open(); } });
  $('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

  // the app tells us when the passcode is wrong
  window.addEventListener('message', e => {
    let host = ''; try { host = new URL(e.origin).hostname; } catch (x) { return; }
    if (!host.endsWith('.googleusercontent.com') && host !== 'script.google.com') return;
    if (e.data && e.data.buylist === 'badkey') { setCode(''); askCode(true); }
    if (e.data && e.data.buylist === 'theme' && /^#[0-9a-f]{3,8}$/i.test(e.data.bar || '') && /^#[0-9a-f]{3,8}$/i.test(e.data.bg || '')) {
      applyBar(e.data);
      try { localStorage.setItem('buylist-bar', JSON.stringify({bar: e.data.bar, bg: e.data.bg, dark: !!e.data.dark})); } catch (x) {}
    }
  });

  // status bar + background follow the theme chosen inside the app
  function applyBar(t) {
    document.getElementById('tc').setAttribute('content', t.bar);
    document.documentElement.style.colorScheme = t.dark ? 'dark' : 'light';
    document.documentElement.style.background = document.body.style.background = t.bg;
    $('splash').style.background = t.bg;
  }
  try { const t = JSON.parse(localStorage.getItem('buylist-bar') || 'null'); if (t) applyBar(t); } catch (e) {}

  open();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
